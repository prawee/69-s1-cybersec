services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data/data:/var/lib/postgresql/data
  admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    ports:
      - ${PGADMIN_DEFAULT_PORT}:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
  app:
    image: prawee/strapi
    container_name: 69-s1-app
    ports:
      - 8181:1337
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_NAME=prawee
      - DATABASE_HOST=172.30.113.245
      - DATABASE_PORT= 54327
      - DATABASE_USERNAME=prawee
      - DATABASE_PASSWORD=1p@ssw0rd
